openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: study
    description: Exam preparation tools
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /study/generate:
    post:
      operationId: generateStudyMaterials
      tags: [study]
      summary: Generate exam-preparation materials from source notes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyGenerationInput"
      responses:
        "200":
          description: Generated study materials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyGeneration"
        "400":
          description: Invalid or insufficient source material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: AI provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many generation requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Study materials could not be generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /study-sets:
    get:
      operationId: listStudySets
      tags: [study]
      summary: List the signed-in user's saved study sets
      responses:
        "200":
          description: Saved study sets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudySet"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /study-sets/{id}:
    put:
      operationId: upsertStudySet
      tags: [study]
      summary: Create or update one of the signed-in user's study sets
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudySetInput"
      responses:
        "200":
          description: Saved study set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySet"
        "400":
          description: Invalid study set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Study set belongs to another account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteStudySet
      tags: [study]
      summary: Delete one of the signed-in user's study sets
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "204":
          description: Study set deleted
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Study set not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StudyGenerationInput:
      type: object
      required: [sourceName, sourceText, hoursPerDay, questionCount]
      properties:
        sourceName:
          type: string
          minLength: 1
          maxLength: 160
        sourceText:
          type: string
          minLength: 120
          maxLength: 180000
        examDate:
          type: string
          format: date
        hoursPerDay:
          type: number
          minimum: 0.5
          maximum: 12
        questionCount:
          type: integer
          minimum: 1
          maximum: 50
        modes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [summary, timed, objective, theory, tutor, cram]
        examMinutes:
          type: integer
          minimum: 1
          maximum: 180
    TheoryQuestion:
      type: object
      required: [prompt, parts]
      properties:
        prompt:
          type: string
        parts:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/TheoryPart"
    TheoryPart:
      type: object
      required: [label, question, modelAnswer]
      properties:
        label:
          type: string
          enum: [a, b, c]
        question:
          type: string
        modelAnswer:
          type: string
    StudyTerm:
      type: object
      required: [term, definition]
      properties:
        term:
          type: string
        definition:
          type: string
    StudyQuestion:
      type: object
      required: [prompt, choices, answerIndex, explanation]
      properties:
        prompt:
          type: string
        choices:
          type: array
          minItems: 4
          maxItems: 5
          items:
            type: string
        answerIndex:
          type: integer
          minimum: 0
          maximum: 4
        explanation:
          type: string
    StudyPlanDay:
      type: object
      required: [date, focus, tasks]
      properties:
        date:
          type: string
          format: date
        focus:
          type: string
        tasks:
          type: array
          items:
            type: string
    StudyGeneration:
      type: object
      required: [title, summary, keyTerms, cramPoints, questions, studyPlan]
      properties:
        tutorLesson:
          type: string
        title:
          type: string
        summary:
          type: string
        keyTerms:
          type: array
          items:
            $ref: "#/components/schemas/StudyTerm"
        cramPoints:
          type: array
          items:
            type: string
        questions:
          type: array
          items:
            $ref: "#/components/schemas/StudyQuestion"
        studyPlan:
          type: array
          items:
            $ref: "#/components/schemas/StudyPlanDay"
        theoryQuestions:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/TheoryQuestion"
        modes:
          type: array
          items:
            type: string
            enum: [summary, timed, objective, theory, tutor, cram]
        examMinutes:
          type: integer
          minimum: 1
          maximum: 180
    StudySetInput:
      type: object
      required:
        [title, sourceName, sourceText, summary, keyTerms, cramPoints, questions, studyPlan, masteredTerms]
      properties:
        tutorLesson:
          type: string
          maxLength: 60000
        title:
          type: string
          minLength: 1
          maxLength: 160
        sourceName:
          type: string
          minLength: 1
          maxLength: 160
        sourceText:
          type: string
          minLength: 120
          maxLength: 180000
        summary:
          type: string
          maxLength: 60000
        keyTerms:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/StudyTerm"
        cramPoints:
          type: array
          maxItems: 100
          items:
            type: string
        questions:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/StudyQuestion"
        studyPlan:
          type: array
          maxItems: 90
          items:
            $ref: "#/components/schemas/StudyPlanDay"
        masteredTerms:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 240
        theoryQuestions:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/TheoryQuestion"
        modes:
          type: array
          items:
            type: string
            enum: [summary, timed, objective, theory, tutor, cram]
        examMinutes:
          type: integer
          minimum: 1
          maximum: 180
    StudySet:
      allOf:
        - $ref: "#/components/schemas/StudySetInput"
        - type: object
          required: [id, createdAt]
          properties:
            id:
              type: string
            createdAt:
              type: string
              format: date-time
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string


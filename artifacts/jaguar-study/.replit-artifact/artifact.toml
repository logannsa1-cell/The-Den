kind = "web"
previewPath = "/python-preview"
title = "Jaguar"
description = "An exam-prep workspace that turns course notes and uploaded documents into focused study guides, cram sheets, practice tests, and day-by-day revision plans."
version = "1.0.0"
id = "artifacts/jaguar-study"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24663

[services.development]
run = "pnpm --filter @workspace/jaguar-study run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/jaguar-study", "run", "build" ]
serve = "static"
publicDir = "artifacts/jaguar-study/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24663"
BASE_PATH = "/"

[[services]]
name = "python-preview"
paths = ["/python-preview"]
localPort = 8000

[services.development]
run = "uv run --project ../.. python python_app/main.py"

[services.production]

[services.production.build]
args = ["uv", "run", "--project", "../..", "python", "-m", "compileall", "-q", "python_app"]

[services.production.run]
args = ["uv", "run", "--project", ".", "python", "python_app/main.py"]

[services.production.run.env]
PORT = "8000"
BASE_PATH = "/python-preview"

[services.env]
PORT = "8000"
BASE_PATH = "/python-preview"

kind = "web"
previewPath = "/"
title = "Jaguar"
description = "An exam-prep workspace that turns course notes and uploaded documents into focused study guides, cram sheets, practice tests, and day-by-day revision plans."
version = "1.0.0"
id = "artifacts/jaguar-study"
router = "path"

[[services]]
name = "web"
paths = ["/sign-in", "/sign-up", "/user-portal", "/assets", "/src", "/@vite", "/@react-refresh", "/@id", "/@fs", "/@replit", "/node_modules/.vite", "/vite-hmr", "/logo.svg", "/favicon.ico", "/jaguar-outline.svg", "/jaguar-icon.svg", "/jaguar-outline.png"]
localPort = 24663

[services.development]
run = "pnpm --filter @workspace/jaguar-study run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/jaguar-study", "run", "build" ]
serve = "static"
publicDir = "artifacts/jaguar-study/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24663"
BASE_PATH = "/"

[[services]]
name = "python-preview"
paths = ["/"]
localPort = 8000

[services.development]
run = "uv run --project ../.. python python_app/main.py"

[services.production]

[services.production.build]
args = ["uv", "run", "--project", ".", "python", "-m", "compileall", "-q", "artifacts/jaguar-study/python_app"]

[services.production.run]
args = ["uv", "run", "--project", ".", "python", "artifacts/jaguar-study/python_app/main.py"]

[services.production.run.env]
PORT = "8000"
BASE_PATH = ""

[services.env]
PORT = "8000"
BASE_PATH = ""

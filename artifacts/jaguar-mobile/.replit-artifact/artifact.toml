kind = "mobile"
previewPath = "/jaguar-mobile/"
title = "Jaguar Mobile"
description = "Native iPhone and Android companion to Jaguar: shared accounts and study sets, multi-file exam preparation, subject-organised lessons, practice and timed papers."
version = "1.0.0"
id = "artifacts/jaguar-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/jaguar-mobile/" ]
localPort = 20712

[services.development]
run = "pnpm --filter @workspace/jaguar-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/jaguar-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/jaguar-mobile", "run", "serve" ]

[services.env]
PORT = "20712"
BASE_PATH = "/jaguar-mobile/"
